# https://pre-commit.com — installed by `uv run just install`; run on every file with `uv run just hooks`.

default_language_version:
  python: python3

exclude: ^tests/unit/transcripts/  # recorded Kiro messages, kept byte for byte

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
        types_or: [python, pyi, markdown]  # the Python blocks in README.md and docs/, as `just check` does

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.2
    hooks:
      - id: commitizen  # conventional commit messages
        stages: [commit-msg]
